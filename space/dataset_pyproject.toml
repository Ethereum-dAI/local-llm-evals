# Shipped as the dataset repo's pyproject.toml so the bundled generators run
# standalone, without the harness.
#
# The `src/` layout is load-bearing, not cosmetic: wallet_evals/intents.py
# resolves `datasets/lookup.json` relative to its own grandparent, so flattening
# the package to the repo root makes that path miss by one level.
#
#   uv run python scripts/generate_finetune_data.py --out data/functiongemma_train.jsonl
[project]
name = "wallet-tool-calling-ft"
version = "0.1.0"
description = "Regenerate the wallet tool-calling SFT data from its seeds"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallet_evals"]
