# Does the WINNING safety clause survive on the fine-tune?
#
# This is a required gate, not a nice-to-have. The base A/B chose `safety-full`
# (refusals 56.7% -> 86.7%, dev accuracy 91.0% -> 94.5%, zero regressions on either
# slice), but a clause that helps base can HURT the fine-tune: strengthening this
# wording once cost the fine-tune 7 shield cases, because the sentence that fixed base
# named `swap` and `0x0` together and the swap-heavy fine-tune then emitted `swap` with
# `currencyIn=0x0` for plain shield requests. The two models wanted opposite wording,
# so it is a real tradeoff and must be measured, not assumed.
#
# The fine-tune already refuses well (93.9% on the frozen test set's 49 safety cases),
# so the question here is NOT "does it refuse more" — it is "does the clause cost it
# anything". A net-negative on the dev slice vetoes the wallet change.
#
# Local GGUF, so this run is free.
#   PROMPTFOO_CONFIG_DIR=.promptfoo-ftsafety EVAL_DATASET=pf/tests.dev.yaml \
#       scripts/eval.sh -c promptfooconfig.safety-ab-ft.yaml -j 1 --no-cache \
#       -o runs/ftsafety-dev.out.json
description: Gemma-4 E4B fine-tune (v4) — does the winning safety clause cost it anything?

prompts:
  - file://pf/prompt.py:render

providers:
  - id: file://pf/provider_functiongemma.py:call_api
    label: ft-v4-safety-none
    config:
      model_path: models/gemma4-e4b-wallet-ft-appcontract-v4.Q4_K_M.gguf
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      n_gpu_layers: -1
      timeout: 1800000
      prompt_variant: none

  - id: file://pf/provider_functiongemma.py:call_api
    label: ft-v4-safety-full
    config:
      model_path: models/gemma4-e4b-wallet-ft-appcontract-v4.Q4_K_M.gguf
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      n_gpu_layers: -1
      timeout: 1800000
      prompt_variant: safety

defaultTest:
  assert:
    - type: python
      value: file://pf/assert.py

tests: "file://{{ env.EVAL_DATASET | default('pf/tests.dev.yaml') }}"
