# 2026-08-11 — Qwen3-8B FINE-TUNED (Q4_K_M), local, 307-case dev set.
#
#   uv run --with modal modal run finetune/modal_finetune_qwen.py
#   uv run --with modal modal run finetune/modal_export_qwen.py
#   uv run --with modal modal volume get qwen-ft-outputs \
#       qwen3-8b-wallet-ft.Q4_K_M.gguf models/
#   scripts/eval.sh -c promptfooconfig.qwen3-ft.yaml -j 1 --no-cache \
#       -o relaunch/qwen3-ft.out.json
#
# Run LOCALLY and at Q4_K_M on purpose: that is exactly how gemma-4-E4B-ft (80.1%)
# and the stock model were measured, so the fine-tune comparison varies the model
# and nothing else.
#
# tool_format: json — the fine-tune is trained to emit Hermes-style
# <tool_call>{"name": ..., "arguments": {...}}</tool_call>, the same shape stock
# Qwen3 emits and the same parser reads (src/wallet_evals/json_tool_calls.py).
#
# temperature 0.6 / top_p 0.95 / top_k 20: Qwen3's card settings, identical to
# promptfooconfig.qwen3.yaml so base and fine-tune are sampled the same way. The
# <think> trace the fine-tune emits is why max_tokens is 2048, not 1024.
description: Qwen3-8B wallet fine-tune (local Q4_K_M) — 307-case dev set

prompts:
  - file://pf/prompt.py:render

providers:
  - id: file://pf/provider_functiongemma.py:call_api
    label: qwen3-8b-ft
    config:
      model_path: models/qwen3-8b-wallet-ft.Q4_K_M.gguf
      tool_format: json
      system_role: system
      n_ctx: 8192
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      max_tokens: 2048
      n_gpu_layers: -1
      timeout: 1800000

defaultTest:
  assert:
    - type: python
      value: file://pf/assert.py

tests: "file://{{ env.EVAL_DATASET | default('pf/tests.generated.yaml') }}"
