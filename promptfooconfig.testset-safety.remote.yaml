# GOAL 1 DELIVERABLE: does base + the chosen safety clause clear ~95% on the frozen
# 1000-case benchmark?
#
# `safety-full` was SELECTED on the dev slices — refusals 56.7% -> 86.7% (+9/-0) and dev
# accuracy 91.0% -> 94.5% (+7/-2). This config MEASURES that choice once on
# pf/tests.combined.yaml. Dev selects, test measures: do not iterate clause wording
# against the number this produces, or the benchmark stops being held out.
#
# BOTH arms run remotely, on purpose. The control is already measured locally at 90.7%
# overall / 92.2% task / 61.2% safety, so re-running it on the rented GPU makes the
# comparison device-controlled AND turns the control into a check on the device itself:
# if remote-none does not reproduce ~90.7%, the device changed the measurement and the
# safety number cannot be trusted either. That is the same reasoning behind
# promptfooconfig.phi4-mini.modal.yaml.
#
#   RUNPOD_LLAMA_URL=https://<pod>-8080.proxy.runpod.net \
#   PROMPTFOO_CONFIG_DIR=.promptfoo-testset EVAL_DATASET=pf/tests.combined.yaml \
#       scripts/eval.sh -c promptfooconfig.testset-safety.remote.yaml -j 8 --no-cache \
#       -o runs/testset-safety.out.json
#
# NOT app parity yet: the clause still has to land in the wallet's own prompt and be
# re-dumped via `wallet-eval prompt-dump` before this is what the app actually sends.
description: Base Gemma-4 E4B on the frozen 1000-case set — no safety clause vs safety-full

prompts:
  - file://pf/prompt.py:render

providers:
  - id: file://pf/provider_functiongemma.py:call_api
    label: base-testset-none
    config:
      repo_id: ggml-org/gemma-4-E4B-it-GGUF
      filename: gemma-4-E4B-it-Q4_K_M.gguf
      revision: 1762c8e8713f
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      timeout: 1800000
      remote_url: env:RUNPOD_LLAMA_URL
      prompt_variant: none

  - id: file://pf/provider_functiongemma.py:call_api
    label: base-testset-full
    config:
      repo_id: ggml-org/gemma-4-E4B-it-GGUF
      filename: gemma-4-E4B-it-Q4_K_M.gguf
      revision: 1762c8e8713f
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      timeout: 1800000
      remote_url: env:RUNPOD_LLAMA_URL
      prompt_variant: safety

defaultTest:
  assert:
    - type: python
      value: file://pf/assert.py

tests: "file://{{ env.EVAL_DATASET | default('pf/tests.combined.yaml') }}"
