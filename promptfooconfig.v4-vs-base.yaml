# Gemma-4 E4B: the published v4 app-prompt fine-tune vs the untuned base, over
# the 1000-case benchmark (pf/tests.combined.yaml — 66% multi-round, no aave/safe).
#
# Two providers only. promptfooconfig.gemma4-fourway.yaml scores eight against the
# old 569-case set; this config exists because the benchmark changed underneath
# (140 aave/safe cases out, 571 conversation cases in), so NOTHING previously
# published is comparable to these numbers. This is a new run vintage.
#
# Both rows are the same base model at the same Q4_K_M quant the wallet ships, the
# same chat template, the same sampling — only the weights differ. So the delta is
# the fine-tune, not the setup.
#
# Run (never a bare `npx promptfoo eval` — see CLAUDE.md):
#   PROMPTFOO_CONFIG_DIR=.promptfoo-v4 scripts/eval.sh \
#       -c promptfooconfig.v4-vs-base.yaml -j 1 --no-cache -o runs/v4-vs-base.out.json
#
# -j 1 is required: both providers are local llama.cpp processes sharing one Metal
# device, so concurrency contends for the GPU instead of speeding anything up.
description: Gemma-4 E4B v4 app-prompt fine-tune vs base — 1000-case benchmark

prompts:
  - file://pf/prompt.py:render

providers:
  # Baseline: the EXACT GGUF local-wallet-mac ships as the untuned reference. The
  # file was deleted from the repo's `main` on 2026-07-16, so it is pulled at the
  # pinned revision that still carries the byte-identical Q4_K_M.
  - id: file://pf/provider_functiongemma.py:call_api
    label: gemma4-e4b-base
    config:
      repo_id: ggml-org/gemma-4-E4B-it-GGUF
      filename: gemma-4-E4B-it-Q4_K_M.gguf
      revision: 1762c8e8713f
      dialect: gemma4
      system_role: system
      # 4096 is verified sufficient, not assumed: the longest prompt in the
      # 1000-case benchmark is 1133 tokens measured with the model's own
      # tokenizer (+1024 max_tokens = 2157). Zero cases exceed it. If a run dies
      # partway with `llama_decode returned -3`, that is the KV-cache bug in
      # CLAUDE.md, NOT this number — raising it will not help.
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      # Metal offload: verified verdict-identical to CPU, ~8x faster.
      n_gpu_layers: -1
      # The 300 s default silently dropped 14 cases to empty output on the
      # published run and scored them as failures. Fail slow cases, don't lose them.
      timeout: 1800000

  # v4: the first fine-tune trained on the bytes the wallet app actually sends —
  # the app's verbatim system prompt, its two tools, and the `<|think|>` marker
  # apply_chat_template omits unless enable_thinking is passed. Pulled from the
  # PUBLISHED repo (private, org-gated) rather than a local build path, so this
  # run is reproducible by anyone with org access.
  #
  # NOTE: v4 was trained with a per-case contract that gave Aave/Safe rows the
  # builder prompt and executeTx. Those cases are no longer in the benchmark, so
  # that part of its training is simply unexercised here — it is not penalised
  # for it, and no case rewards it either.
  - id: file://pf/provider_functiongemma.py:call_api
    label: gemma4-e4b-ft-v4-appprompt
    config:
      repo_id: ef-dai-team/gemma-4-E4B-wallet-ft-v4
      filename: gemma-4-E4B-wallet-ft-v4.Q4_K_M.gguf
      dialect: gemma4
      system_role: system
      # 4096 is verified sufficient, not assumed: the longest prompt in the
      # 1000-case benchmark is 1133 tokens measured with the model's own
      # tokenizer (+1024 max_tokens = 2157). Zero cases exceed it. If a run dies
      # partway with `llama_decode returned -3`, that is the KV-cache bug in
      # CLAUDE.md, NOT this number — raising it will not help.
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      n_gpu_layers: -1
      timeout: 1800000

defaultTest:
  assert:
    - type: python
      value: file://pf/assert.py

tests: "file://{{ env.EVAL_DATASET | default('pf/tests.combined.yaml') }}"
