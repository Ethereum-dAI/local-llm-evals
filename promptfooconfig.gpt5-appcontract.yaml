# gpt-5 on the FROZEN 1000-case benchmark, under the app contract.
#
# The frontier anchor for the final report. The eval is built as a discriminator, so a
# capable hosted model should sit near the top; if gpt-5 does NOT, the dataset has a
# problem rather than the on-device models being surprisingly good.
#
# `tools.app.json`, NOT `tools.json`. All 1000 cases are wallet-path (476 uniswap / 475
# transfer / 49 safety — no Aave or Safe), so the two tools the app actually ships are
# the correct menu. Handing gpt-5 the 5-tool builder set would score it against a
# contract this dataset does not use, and pf/prompt.py:render already gives every local
# model exactly these two via `tools_for`.
#
# temperature 0.1 / max_tokens 4096 are copied from promptfooconfig.gpt5-only.yaml so
# this stays comparable to the recorded gpt-5 measurements. DO NOT lower max_tokens:
# 512 truncated gpt-5's reasoning and cost it accuracy.
#
# Separate config from the local arms on purpose — gpt-5 is network-bound and
# parallelizes freely at -j 8, while a GGUF arm is bound by its server's slot count.
#
#   scripts/eval.sh -c promptfooconfig.gpt5-appcontract.yaml -j 8 --no-cache \
#       -o runs/gpt5-1000.out.json
description: gpt-5 anchor on the frozen 1000-case benchmark (app contract)

prompts:
  - file://pf/prompt.py:render

providers:
  - id: openrouter:openai/gpt-5
    label: gpt-5
    config:
      temperature: 0.1
      max_tokens: 4096
      tools: file://pf/tools.app.json

defaultTest:
  assert:
    - type: python
      value: file://pf/assert.py

tests: "file://{{ env.EVAL_DATASET | default('pf/tests.combined.yaml') }}"
