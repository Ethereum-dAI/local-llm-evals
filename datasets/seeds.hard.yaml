# Structured intents for the hard slice
# (scripts/generate_hard_cases.py -> pf/tests.hard.yaml).
#
# Same shape as datasets/seeds.conversations.yaml: params are literals,
# {vary: [...]} sets, or the sentinel "random_address" / "random_ens". Gold is
# COMPUTED from the final effective intent, never parsed from a surface.
#
# Amount literals are disjoint from datasets/seeds.yaml, seeds.arithmetic.yaml,
# seeds.conversations.yaml, seeds.dev.yaml and finetune_seeds.yaml by exact-string
# set intersection -- asserted in tests/test_hard_benchmark.py on the GOLD amounts,
# which also covers the revision targets and the surface banks in
# src/wallet_evals/hard_cases.py.

# --- ETH transfers ---------------------------------------------------------
- action: transfer
  amount: { vary: ["0.0416", "3.875", "0.00613", "17.2"] }
  token: ETH
  recipient: { vary: ["random_ens", "random_address"] }

# --- stablecoin transfers (<=6 dp so USDC stays representable) -------------
- action: transfer
  amount: { vary: ["1840.5", "62.75", "0.815", "29000.4"] }
  token: { vary: ["USDC", "DAI"] }
  recipient: { vary: ["random_ens", "random_address"] }

# --- swaps -----------------------------------------------------------------
- action: swap
  amount: { vary: ["0.7071", "4.4", "0.0288"] }
  from_token: { vary: ["ETH", "WETH"] }
  to_token: { vary: ["USDC", "DAI"] }

- action: swap
  amount: { vary: ["915.25", "38.6"] }
  from_token: { vary: ["USDC", "DAI"] }
  to_token: { vary: ["ETH", "WETH"] }
