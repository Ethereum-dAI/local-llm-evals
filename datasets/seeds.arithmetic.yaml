# Labelled arithmetic slice: amounts chosen to isolate four specific failure
# modes a full app-contract run (2026-08-13, base Gemma-4 E4B 87.9%, wallet
# fine-tune 75.6%) exposed but could not measure, because they were smeared
# across other categories. Generated by scripts/generate_cases.py's
# --extra-seeds path with its OWN random.Random(SEED_ARITHMETIC) — a
# deliberately SEPARATE RNG stream from datasets/seeds.yaml, so appending this
# file never reshuffles or renumbers the existing 307 app-contract cases.
#
# Amount literals are disjoint from both datasets/seeds.yaml (14 amounts) and
# datasets/finetune_seeds.yaml (45 amounts) — checked by exact-string set
# intersection before authoring this file. Every amount stays integral in base
# units for its token's decimals (ETH/WETH/DAI=18, USDC=6); token/from_token
# are held fixed per group (ETH, which tolerates up to 18 dp) so only the
# amount varies within a failure mode.
#
# Recipients VARY. They were `recipient: vitalik.eth` on every transfer seed, which
# made `to` CONSTANT across all 36 transfer golds in this slice — a free field a
# model could hardcode, the same defect as swap's `amount_side`, and invisible in
# the whole-dataset view because `to` had 63 distinct values there.
#
# Each transfer seed lists FOUR recipient entries, not two. `random_ens` and
# `random_address` are SENTINELS resolved per produced intent
# (generation._resolve_value), so a repeated entry draws a DIFFERENT value each
# time rather than duplicating one. Two of each holds the ENS:address ratio at
# 50:50 while giving this slice — which has only 9 amount variants, so a small
# intent pool — enough distinct recipients that no single one dominates. With two
# entries the ENS ceiling was 9 draws and the slice landed on 4 distinct names;
# with four it clears the bound in test_dataset_degeneracy.py.
#
# The per-action cap of 40 (MAX_PER_ACTION_ARITHMETIC) already binds, so widening
# the pool diversifies the draw without changing this slice's size.
# `random_ens` excludes vitalik.eth on purpose; see generation.ENS_NAMES.
#
# - separators: 4+ digit integer part, so the surface renders comma-grouped
#   (e.g. "1,000.5") and the punctuation mutator groups it more often than
#   incidentally. The observed bug: a model drops the comma and rereads
#   "987,654.32" as "987.65432" — silently valid, wrong by 3 orders of
#   magnitude.
# - base-unit-traps: small decimals where the wei/base-unit form is tempting.
#   Observed: models emitting "1000000000000000000" (wei for 1 ETH) or a bare
#   "7" instead of the human decimal.
# - precision: many significant digits, stress-testing the model's ability to
#   copy digits verbatim without rounding or truncating.
# - formatting: trailing zeros and bare integers, which must pass under the
#   scorer's decimal fold (Decimal-equal, not string-equal).

# --- separators: transfer -------------------------------------------------
- action: transfer
  amount: { vary: ["1000.5", "20000", "5432100.75"] }
  token: ETH
  recipient: { vary: ["random_ens", "random_ens", "random_address", "random_address"] }
  ablate: ["recipient", "amount"]

# --- separators: swap ------------------------------------------------------
- action: swap
  amount: { vary: ["1000.5", "20000", "5432100.75"] }
  from_token: ETH
  to_token: USDC
  ablate: ["to_token", "amount"]

# --- base-unit traps: transfer ---------------------------------------------
- action: transfer
  amount: { vary: ["0.0000002", "0.00000005"] }
  token: ETH
  recipient: { vary: ["random_ens", "random_ens", "random_address", "random_address"] }
  ablate: ["recipient", "amount"]

# --- base-unit traps: swap --------------------------------------------------
- action: swap
  amount: { vary: ["0.0000002", "0.00000005"] }
  from_token: ETH
  to_token: USDC
  ablate: ["to_token", "amount"]

# --- precision: transfer -----------------------------------------------------
- action: transfer
  amount: { vary: ["8765.432109876", "0.123456789012345678"] }
  token: ETH
  recipient: { vary: ["random_ens", "random_ens", "random_address", "random_address"] }
  ablate: ["recipient", "amount"]

# --- precision: swap ----------------------------------------------------------
- action: swap
  amount: { vary: ["8765.432109876", "0.123456789012345678"] }
  from_token: ETH
  to_token: USDC
  ablate: ["to_token", "amount"]

# --- formatting: transfer -------------------------------------------------------
- action: transfer
  amount: { vary: ["1.50", "250"] }
  token: ETH
  recipient: { vary: ["random_ens", "random_ens", "random_address", "random_address"] }
  ablate: ["recipient", "amount"]

# --- formatting: swap --------------------------------------------------------
- action: swap
  amount: { vary: ["1.50", "250"] }
  from_token: ETH
  to_token: USDC
  ablate: ["to_token", "amount"]
