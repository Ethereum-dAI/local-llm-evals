# The safety A/B, served from a rented RunPod GPU instead of this laptop.
#
# IDENTICAL to promptfooconfig.safety-ab.yaml except for `remote_url`. Same GGUF at the
# same pinned revision, same chat template (still rendered LOCALLY from that GGUF's own
# metadata), same sampling, same scorer — only token generation moves to the GPU. That
# is deliberately the narrowest possible change, because "the device changed the
# measurement" is a real risk in this repo and the only defence is keeping everything
# else byte-identical so the two runs can be compared case by case.
#
# `seed` is pinned and `cache_prompt` disabled in _remote_completion, so the remote arm
# is reproducible rather than merely fast.
#
#   RUNPOD_LLAMA_URL=$(...) PROMPTFOO_CONFIG_DIR=.promptfoo-safety-remote \
#       EVAL_DATASET=pf/tests.dev.safety.yaml scripts/eval.sh \
#       -c promptfooconfig.safety-ab.remote.yaml -j 8 --no-cache -o runs/remote.out.json
#
# A SEPARATE PROMPTFOO_CONFIG_DIR is mandatory: promptfoo keeps one SQLite result DB per
# config dir, and a second concurrent run against the same dir takes both down with
# SQLITE_BUSY mid-flight — which can still write a plausible-looking export missing the
# cases it never reached.
description: Base Gemma-4 E4B on RunPod — no safety clause vs full vs minimal

prompts:
  - file://pf/prompt.py:render

providers:
  - id: file://pf/provider_functiongemma.py:call_api
    label: base-safety-none
    config:
      repo_id: ggml-org/gemma-4-E4B-it-GGUF
      filename: gemma-4-E4B-it-Q4_K_M.gguf
      revision: 1762c8e8713f
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      timeout: 1800000
      remote_url: env:RUNPOD_LLAMA_URL
      # Explicit rather than omitted, so the control arm's behaviour is stated
      # rather than inferred from a default.
      prompt_variant: none

  - id: file://pf/provider_functiongemma.py:call_api
    label: base-safety-full
    config:
      repo_id: ggml-org/gemma-4-E4B-it-GGUF
      filename: gemma-4-E4B-it-Q4_K_M.gguf
      revision: 1762c8e8713f
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      timeout: 1800000
      remote_url: env:RUNPOD_LLAMA_URL
      # Explicit rather than omitted, so the control arm's behaviour is stated
      # rather than inferred from a default.
      prompt_variant: safety

  - id: file://pf/provider_functiongemma.py:call_api
    label: base-safety-min
    config:
      repo_id: ggml-org/gemma-4-E4B-it-GGUF
      filename: gemma-4-E4B-it-Q4_K_M.gguf
      revision: 1762c8e8713f
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      timeout: 1800000
      remote_url: env:RUNPOD_LLAMA_URL
      # Explicit rather than omitted, so the control arm's behaviour is stated
      # rather than inferred from a default.
      prompt_variant: safety-min

defaultTest:
  assert:
    - type: python
      value: file://pf/assert.py

tests: "file://{{ env.EVAL_DATASET | default('pf/tests.dev.yaml') }}"
