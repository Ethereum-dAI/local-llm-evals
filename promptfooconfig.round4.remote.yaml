# Round 4: the two levers aimed at the 40-case no-call bucket.
#
# THE BUCKET, measured rather than assumed: 40 of base's 74 non-safety failures on the
# frozen set are "expected a call, made NONE". 37 of the 40 carry the `typos` mutator and
# 36 of 40 are multi-turn, so this is typo'd surfaces in conversations. Crucially, 14 of
# the 40 named the right tool AND every gold argument value in their own reasoning trace,
# and 10 more got all but one — about 60% had worked the answer out and asked anyway
# ("I think you want to swap 987654.32 USDC for DAI. Is that correct?"). That makes it a
# COMMITMENT failure for most of the bucket, not a comprehension failure.
#
# Fine-tuning is not the fix: ft-v4 has 74 no-call failures against base's 40.
# A prompt clause is not the fix either: ACT_NOT_ASK was read (799 -> 902 prompt tokens)
# and ignored (9/9 failures still ended in "?"). See results/act-ab.base-e4b.md.
#
# So the two remaining mechanisms:
#   retry    — app-level. If the model answers without calling, ONE more user turn asks it
#              to act. Kept only if the retry produces a call, so a second refusal cannot
#              overwrite an honest first answer.
#   fewshot  — in-context DEMONSTRATION rather than instruction, which is a different
#              mechanism from the clause that failed. Its 4th exemplar REFUSES, so it
#              cannot teach "always call".
#
# BOTH ARE DANGEROUS IN THE SAME DIRECTION and that is the point of running the safety
# slice: each one works by making the model less hesitant, and ACT_NOT_ASK already lost 2
# refusals doing exactly that. An arm that gains accuracy and loses refusals is a
# regression, not a win, for a wallet that moves real money.
#
# Arms 1-2 identical for the noise floor: this slice cannot resolve below ~7 cases (2
# sigma), measured — see results/temp-sweep.base-e4b.md.
description: Base Gemma-4 E4B on RunPod — retry-on-no-call and few-shot vs the 40-case bucket

prompts:
  - file://pf/prompt.py:render

providers:
  - id: file://pf/provider_functiongemma.py:call_api
    label: base-r4-control-a
    config:
      repo_id: ggml-org/gemma-4-E4B-it-GGUF
      filename: gemma-4-E4B-it-Q4_K_M.gguf
      revision: 1762c8e8713f
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      timeout: 1800000
      remote_url: env:RUNPOD_LLAMA_URL
      prompt_variant: none
      retry_on_no_call: false

  - id: file://pf/provider_functiongemma.py:call_api
