# gpt-5 alone — the frontier anchor half of the head-to-head.
#
#   scripts/eval.sh -c promptfooconfig.gpt5-only.yaml -j 8 -o gpt5.fresh.out.json
#
# Split out from the local model deliberately: gpt-5 is NETWORK-bound (~37 s/case,
# dominated by reasoning tokens) while the local GGUF is CPU-bound, so running them
# in one serialized eval made each wait on the other. Apart, gpt-5 parallelizes
# freely at -j 8 and the local side keeps its required -j 1.
#
# Provider config is byte-identical to promptfooconfig.yaml's gpt-5 block so this
# stays comparable to the Jul 9 measurement (96.7%). Do not lower max_tokens —
# 512 truncated gpt-5's reasoning and cost it accuracy.
description: gpt-5 anchor (fresh) — wallet executeTx/readTx/swap intent eval

prompts:
  - file://pf/prompt.py:render

providers:
  - id: openrouter:openai/gpt-5
    config:
      temperature: 0.1
      max_tokens: 4096
      tools: file://pf/tools.json

defaultTest:
  assert:
    - type: python
      value: file://pf/assert.py

tests: "file://{{ env.EVAL_DATASET | default('pf/tests.generated.yaml') }}"
