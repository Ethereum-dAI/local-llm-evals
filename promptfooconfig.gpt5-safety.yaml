# THE MISSING CELL: gpt-5 WITH the safety clause, frozen 1000-case benchmark.
#
# Every other number in the report was taken with the app's own prompt and no safety
# clause, because "keep the same prompt as the wallet" is the constraint the whole
# effort runs under. That left the report with an unfair-looking row: v5 + SAFETY_FULL
# scores 95.9% on the refusal slice against gpt-5's 69.4% — but gpt-5 never saw the
# clause, so that comparison reads a PROMPT difference as a MODEL difference.
#
# gpt-5 fails the same refusal kinds base fails (burn-address sends, zero-address
# sends, unknown-token swaps), which is why this is worth $7 rather than assumable:
# if the clause lifts gpt-5 the way it lifted base and v5, the honest four-way table
# has both models clause-on, and v5's safety win shrinks to whatever survives that.
#
# HOW THE CLAUSE GETS IN. Not through provider config — promptfoo renders the prompt
# before the provider is reached, so `config.prompt_variant` (which the local GGUF
# provider reads) cannot reach a hosted one. `pf/prompt.py:_env_variant` reads
# $PROMPT_VARIANT instead and routes through the SAME `augment()` the local arm used,
# so the system turn is byte-identical at 2110 chars. It is OFF by default and
# tests/test_prompt_contract.py pins that — a variant leaking into a default run
# would make every recorded number measure a prompt the wallet does not send.
#
# EVERYTHING ELSE IS COPIED FROM promptfooconfig.gpt5-appcontract.yaml UNCHANGED:
# same model id, temperature 0.1, max_tokens 4096, `pf/tools.app.json` (2 tools).
# The control is that config's recorded run, runs/gpt5-1000.out.json (2026-08-18,
# 928/1000, 0 provider errors) — one day apart, same model id, so this is an A/B
# across processes rather than within one run. Hosted drift is the one uncontrolled
# variable; the per-case join in the report is what bounds it.
#
#   PROMPT_VARIANT=safety PROMPTFOO_CONFIG_DIR=.promptfoo-gpt5safety \
#     scripts/eval.sh -c promptfooconfig.gpt5-safety.yaml -j 8 --no-cache \
#     -o runs/gpt5-1000.safety.out.json
description: gpt-5 + SAFETY_FULL on the frozen 1000-case benchmark (app contract)

prompts:
  - file://pf/prompt.py:render

providers:
  - id: openrouter:openai/gpt-5
    label: gpt-5-safety-full
    config:
      temperature: 0.1
      max_tokens: 4096
      tools: file://pf/tools.app.json

defaultTest:
  assert:
    - type: python
      value: file://pf/assert.py

tests: "file://{{ env.EVAL_DATASET | default('pf/tests.combined.yaml') }}"
