# The candidate stack: safety-full + retry-on-no-call.
#
# Round 4 produced a frontier, not a winner, and the two halves came from opposite places:
#
#   retry-on-no-call  HALVED its target bucket — no-call failures 9/10 -> 4, against a
#                     control-to-control spread of 1 — at ZERO refusal cost (+1/-1).
#                     Its aggregate accuracy gain (+3) is inside the noise floor, because
#                     it converts some no-calls into WRONG-argument calls (2 -> 4).
#   few-shot          BACKFIRED on accuracy: -11 net (+1/-12), well outside the floor, and
#                     no-call failures went UP 9 -> 20. But refusals rose 17 -> 23 (+6/-0).
#                     One refusal exemplar out of four over-corrected: the demonstrations
#                     shifted the act/refuse balance toward refusing everything.
#
# few-shot is therefore REJECTED, because safety-full strictly dominates it: 86.7% refusals
# with no accuracy cost, versus few-shot's 76.7% for -11 accuracy. Buying refusals by
# refusing more is not the same as knowing what to refuse.
#
# This config tests the pairing that has never been run together: the clause that wins
# refusals cleanly, plus the mechanism that wins the no-call bucket cleanly. They are
# independent — one edits the prompt, the other adds a turn — but they push in OPPOSITE
# directions on hesitancy, so the combination has to be measured rather than assumed
# additive.
#
# Arms 1-2 identical for the noise floor, as always on this slice.
description: Base Gemma-4 E4B on RunPod — safety-full combined with retry-on-no-call

prompts:
  - file://pf/prompt.py:render

providers:
  - id: file://pf/provider_functiongemma.py:call_api
    label: base-r5-control-a
    config:
      repo_id: ggml-org/gemma-4-E4B-it-GGUF
      filename: gemma-4-E4B-it-Q4_K_M.gguf
      revision: 1762c8e8713f
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      timeout: 1800000
      remote_url: env:RUNPOD_LLAMA_URL
      prompt_variant: none
      retry_on_no_call: false

  - id: file://pf/provider_functiongemma.py:call_api
    label: base-r5-control-b
    config:
      repo_id: ggml-org/gemma-4-E4B-it-GGUF
      filename: gemma-4-E4B-it-Q4_K_M.gguf
      revision: 1762c8e8713f
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
      timeout: 1800000
      remote_url: env:RUNPOD_LLAMA_URL
      prompt_variant: none
      retry_on_no_call: false

  - id: file://pf/provider_functiongemma.py:call_api
    label: base-r5-safety
    config:
      repo_id: ggml-org/gemma-4-E4B-it-GGUF
      filename: gemma-4-E4B-it-Q4_K_M.gguf
      revision: 1762c8e8713f
      dialect: gemma4
      system_role: system
      n_ctx: 4096
      temperature: 0.2
      max_tokens: 1024
